<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Platform</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <script
            type="text/javascript"
            src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js">
    </script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Trading Platform</span>
    </div>
</nav>

<div class="container mt-4">

    <div class="row g-3">
        <div class="col-md-3">
            <label class="form-label">Ticker</label>
            <select class="form-select" id="tickerSelect">
                <option value="BTCUSDT">BTCUSDT</option>
                <option value="ETHUSDT">ETHUSDT</option>
                <option value="SOLUSDT">SOLUSDT</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Interval</label>
            <select class="form-select" id="intervalSelect">
                <option value="d1">1 Day</option>
                <option value="h4">4 Hours</option>
                <option value="h1">1 Hour</option>
                <option value="m15">15 Minutes</option>
                <option value="m5">5 Minutes</option>
                <option value="m1">1 Minute</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label d-block">Interaction</label>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="enableScaleToggle" checked>
                <label class="form-check-label" for="enableScaleToggle">
                    Enable zoom / scale
                </label>
            </div>

            <div class="form-check mt-1">
                <input class="form-check-input" type="checkbox" id="enableScrollToggle" checked>
                <label class="form-check-label" for="enableScrollToggle">
                    Enable scroll
                </label>
            </div>

            <div class="form-check mt-1">
                <input class="form-check-input" type="checkbox" id="showVolumeToggle" >
                <label class="form-check-label" for="showVolumeToggle">
                    Show volume
                </label>
            </div>

            <div class="form-check mt-1">
                <input class="form-check-input" type="checkbox" id="showSmaToggle" >
                <label class="form-check-label" for="showSmaToggle" id="showSmaLabel">
                    Show SMA(5)
                </label>
            </div>

            <div class="form-check mt-1">
                <input class="form-check-input" type="checkbox" id="showEmaToggle" >
                <label class="form-check-label" for="showEmaToggle" id="showEmaLabel">
                    Show EMA(9)
                </label>
            </div>

            <div class="form-check mt-1">
                <input class="form-check-input" type="checkbox" id="showCeToggle" checked>
                <label class="form-check-label" for="showCeToggle" id="showCeLabel">
                    Show Chandelier Exit
                </label>
            </div>

            <div class="form-check mt-1">
                <input class="form-check-input" type="checkbox" id="ceUseCloseToggle" checked>
                <label class="form-check-label" for="ceUseCloseToggle">
                    CE Use Close
                </label>
            </div>
        </div>

        <div class="col-md-3">
            <label class="form-label">SMA Period</label>
            <select class="form-select mb-3" id="smaPeriodSelect">
                <option value="5" selected>5</option>
                <option value="9">9</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>

            <label class="form-label">EMA Period</label>
            <select class="form-select mb-3" id="emaPeriodSelect">
                <option value="5">5</option>
                <option value="9" selected>9</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>

            <label class="form-label">CE ATR Period</label>
            <select class="form-select mb-3" id="ceLengthSelect">
                <option value="10">10</option>
                <option value="14">14</option>
                <option value="22" selected>22</option>
                <option value="50">50</option>
            </select>

            <label class="form-label">CE Multiplier</label>
            <input
                    type="number"
                    step="0.1"
                    min="0.1"
                    class="form-control"
                    id="ceMultiplierInput"
                    value="3.0">
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body py-2">
                    <div class="d-flex flex-wrap gap-4">
                        <div>
                            <strong>Ticker:</strong>
                            <span id="selectedTickerLabel">BTCUSDT</span>
                        </div>
                        <div>
                            <strong>Interval:</strong>
                            <span id="selectedIntervalLabel">d1</span>
                        </div>
                        <div>
                            <strong>Last Close:</strong>
                            <span id="lastCloseLabel">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-12">
            <div id="loadingMessage" class="alert alert-info d-none" role="alert">
                Loading candles...
            </div>

            <div id="errorMessage" class="alert alert-danger d-none" role="alert">
                Failed to load chart data.
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div id="chart" style="height: 650px; width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="row mt-4 g-3">

        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header">
                    <strong>Chandelier Exit Backtest</strong>
                </div>

                <div class="card-body">

                    <div class="row g-3 align-items-end">

                        <div class="col-md-2">
                            <label class="form-label">Candle Count</label>
                            <input type="number"
                                   class="form-control"
                                   id="btLimit"
                                   value="300"
                                   min="20"
                                   max="2000">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">From</label>
                            <input type="datetime-local"
                                   class="form-control"
                                   id="btFrom">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">To</label>
                            <input type="datetime-local"
                                   class="form-control"
                                   id="btTo">
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Deposit</label>
                            <input type="number"
                                   class="form-control"
                                   id="btCapital"
                                   value="1000">
                        </div>

                        <div class="col-md-1">
                            <label class="form-label">Length</label>
                            <input type="number"
                                   class="form-control"
                                   id="btLength"
                                   value="22">
                        </div>

                        <div class="col-md-1">
                            <label class="form-label">Mult</label>
                            <input type="number"
                                   class="form-control"
                                   id="btMult"
                                   step="0.1"
                                   value="3.0">
                        </div>

                        <div class="col-md-1 d-grid">
                            <button id="runBacktestBtn"
                                    class="btn btn-primary">
                                Run
                            </button>
                        </div>

                    </div>

                </div>
            </div>
        </div>


        <div class="col-12">

            <div class="card shadow-sm">

                <div class="card-header">
                    <strong>Backtest Summary</strong>
                </div>

                <div class="card-body">

                    <div id="btSummary" class="row g-3">

                        <div class="col-md-3">
                            <div class="border p-3 rounded">
                                Initial Capital:
                                <strong id="btInitial">-</strong>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="border p-3 rounded">
                                Final Capital:
                                <strong id="btFinal">-</strong>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="border p-3 rounded">
                                Net Profit:
                                <strong id="btProfit">-</strong>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="border p-3 rounded">
                                Win Rate:
                                <strong id="btWinRate">-</strong>
                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="/js/chart.js?v=2"></script>
<script src="/js/backtest.js?v=1"></script>
</body>
</html>
